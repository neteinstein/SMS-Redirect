<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Illustrations for docs/install-apk.md. render.js opens this page once per screen and calls
  window.renderScreen(key). They are drawn in HTML to look like stock Android 14-16 system
  screens; they are not device captures, and wording differs a little between phone makers.
  Fonts and icons are shared with store-listing/scripts/store_assets/.
-->
<style>
@font-face { font-family: Roboto; src: url(../../../store-listing/scripts/store_assets/fonts/roboto-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Roboto; src: url(../../../store-listing/scripts/store_assets/fonts/roboto-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Roboto; src: url(../../../store-listing/scripts/store_assets/fonts/roboto-latin-700-normal.woff2); font-weight: 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #E8EEF7; font-family: Roboto, sans-serif; }
#stage { width: 480px; height: 940px; display: grid; place-items: center; }
.phone { width: 420px; height: 880px; border-radius: 48px; background: #1B1B1F; padding: 12px; box-shadow: 0 20px 50px rgba(20,40,80,.28); }
.screen { width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #F8F9FF; color: #1A1C1E; position: relative; display: flex; flex-direction: column; }
.sbar { height: 40px; padding: 12px 26px 0; display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; }
.i { width: 24px; height: 24px; fill: currentColor; flex: none; }
.top { padding: 14px 20px 18px; display: flex; align-items: center; gap: 18px; }
.top h1 { font-size: 28px; font-weight: 400; }
.top.small h1 { font-size: 22px; }
.list { padding: 0 12px; }
.item { display: flex; align-items: center; gap: 18px; padding: 14px 12px; border-radius: 20px; }
.item .t { font-size: 17px; }
.item .s { font-size: 14px; color: #44474E; margin-top: 2px; }
.grow { flex: 1; min-width: 0; }
.hl { background: #D3E3FD; box-shadow: 0 0 0 3px #1A73E8 inset; }
.sw { width: 52px; height: 32px; border-radius: 16px; background: #1A73E8; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; }
.sw.off { background: #E1E2EC; box-shadow: 0 0 0 2px #74777F inset; }
.sw.off::after { left: 8px; right: auto; top: 8px; width: 16px; height: 16px; background: #74777F; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.42); display: grid; place-items: center; }
.dialog { width: 340px; background: #ECEEF4; border-radius: 28px; padding: 24px; }
.dialog .ic { display: flex; justify-content: center; color: #1A73E8; margin-bottom: 14px; }
.dialog h2 { font-size: 22px; font-weight: 400; text-align: center; margin-bottom: 14px; }
.dialog p { font-size: 15px; line-height: 1.45; color: #44474E; }
.actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 22px; flex-wrap: wrap; }
.btn { font-size: 15px; font-weight: 500; color: #1A73E8; padding: 10px 14px; border-radius: 20px; }
.btn.fill { background: #1A73E8; color: #fff; }
.btn.ring { box-shadow: 0 0 0 3px #E8710A; }
.toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: #303034; color: #fff; padding: 12px 20px; border-radius: 22px; font-size: 15px; white-space: nowrap; }
.tap { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: rgba(232,113,10,.28); box-shadow: 0 0 0 3px #E8710A; }
.badge { position: absolute; background: #E8710A; color: #fff; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 12px; }
.web { padding: 10px 16px; }
.url { background: #E1E2EC; border-radius: 22px; padding: 10px 16px; font-size: 14px; color: #44474E; }
.gh h3 { font-size: 22px; margin: 18px 4px 6px; }
.gh .tag { font-size: 13px; color: #fff; background: #1F883D; border-radius: 12px; padding: 2px 10px; display: inline-block; margin: 0 4px 12px; }
.gh .box { border: 1px solid #D0D7DE; border-radius: 10px; overflow: hidden; background: #fff; }
.gh .row { display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #D0D7DE; font-size: 14px; color: #0969DA; }
.gh .row:first-child { border-top: none; color: #1F2328; font-weight: 600; background: #F6F8FA; }
.gh .size { margin-left: auto; color: #59636E; }
.banner { background: #D3E3FD; color: #001A41; display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-size: 14px; }
.app-top { padding: 14px 20px; display: flex; align-items: center; gap: 14px; font-size: 22px; }
.card { margin: 10px 16px; padding: 16px; border-radius: 16px; background: #fff; }
.muted { color: #44474E; font-size: 14px; }
.pbtn { display: inline-block; background: #1A73E8; color: #fff; border-radius: 20px; padding: 10px 20px; font-size: 15px; font-weight: 500; margin-top: 12px; }
.obtn { display: inline-block; box-shadow: 0 0 0 1px #74777F inset; color: #1A73E8; border-radius: 20px; padding: 10px 20px; font-size: 15px; font-weight: 500; margin: 12px 0 0 8px; }
.menu { position: absolute; right: 14px; top: 58px; width: 250px; background: #ECEEF4; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); padding: 8px 0; }
.menu div { padding: 14px 18px; font-size: 16px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../../../store-listing/scripts/store_assets/icons.js"></script>
<script>
const P = {
  info: '<path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>',
  phone: '<path d="M17 1.01 7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>',
  code: '<path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>',
  back: '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>',
  more: '<path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>',
  shield: '<path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 6h2v6h-2V7zm0 8h2v2h-2v-2z"/>',
  dl: '<path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>',
  pkg: '<path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/>',
  update: '<path d="M17 1.01 7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14zm-1-6h-3V8h-2v5H8l4 4 4-4z"/>',
  settings: '<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>',
};
const ic = (n, style = "") => `<svg class="i" viewBox="0 0 24 24" style="${style}">${P[n] || ICONS[n]}</svg>`;
const sbar = () => `<div class="sbar"><span>9:41</span><span>▼◢▮</span></div>`;
const topBar = (title, { back = true, small = false, more = false } = {}) =>
  `<div class="top ${small ? "small" : ""}">${back ? ic("back") : ""}<h1 class="grow">${title}</h1>${more ? ic("more") : ""}</div>`;
const item = (icon, t, s = "", { hl = false, trail = "" } = {}) =>
  `<div class="item ${hl ? "hl" : ""}">${icon ? ic(icon, "color:#44474E") : ""}<div class="grow"><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ""}</div>${trail}</div>`;
const phone = inner => `<div class="phone"><div class="screen">${sbar()}${inner}</div></div>`;

const SCREENS = {
  "01-download": () => phone(`
    <div class="web"><div class="url">github.com/neteinstein/SMS-Redirect/releases</div></div>
    <div class="web gh">
      <h3>Release v2.0.11</h3><span class="tag">Latest</span>
      <p class="muted" style="margin:0 4px 16px">Installing: download SMS-Toolbox_v*.apk below…</p>
      <div class="box">
        <div class="row">▾ Assets 3</div>
        <div class="row hl">${ic("pkg")}SMS-Toolbox_v2.0.11.apk<span class="size">9.8 MB</span></div>
        <div class="row">Source code (zip)</div>
        <div class="row">Source code (tar.gz)</div>
      </div>
    </div>
    <div class="toast" style="bottom:60px">Downloading SMS-Toolbox_v2.0.11.apk…</div>`),

  "02-build-number": () => phone(`
    ${topBar("About phone")}
    <div class="list">
      ${item("phone", "Device name", "Pixel")}
      ${item("", "Android version", "16")}
      ${item("", "IP address", "Unavailable")}
      ${item("", "Build number", "BP2A.250605.031", { hl: true })}
    </div>
    <div class="badge" style="left:280px;top:330px">Tap 7×</div>
    <div class="toast">You are now a developer!</div>`),

  "03-developer-options": () => phone(`
    ${topBar("Developer options")}
    <div class="list">
      <div class="item hl" style="background:#D3E3FD"><div class="grow"><div class="t" style="font-size:19px">Use developer options</div></div><div class="sw"></div></div>
      ${item("", "Memory", "1.4 GB of 8 GB memory used")}
      ${item("", "Bug report")}
      ${item("", "Verify apps over USB", "Check apps installed via ADB/ADT")}
      ${item("", "Stay awake", "", { trail: '<div class="sw off"></div>' })}
    </div>`),

  "04-unknown-source": () => phone(`
    ${topBar("Install unknown apps", { small: true })}
    <div class="list">
      <div class="item"><div style="width:44px;height:44px;border-radius:50%;background:#1A73E8"></div><div class="grow"><div class="t">Chrome</div><div class="s">146.0</div></div></div>
      <div class="item hl"><div class="grow"><div class="t">Allow from this source</div></div><div class="sw"></div></div>
      <p class="muted" style="padding:14px 12px;line-height:1.45">Your phone and personal data are more vulnerable to attack by unknown apps. By installing apps from this source, you agree that you are responsible for any damage to your phone or loss of data that may result from their use.</p>
    </div>`),

  "05-install": () => phone(`
    <div style="flex:1"></div>
    <div class="scrim"><div class="dialog">
      <div class="ic"><div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#3D8BFD,#0F4FB8)"></div></div>
      <h2>SMS Toolbox</h2>
      <p style="text-align:center">Do you want to install this app?</p>
      <div class="actions"><span class="btn">Cancel</span><span class="btn ring">Install</span></div>
    </div></div>`),

  "06-play-protect": () => phone(`
    <div style="flex:1"></div>
    <div class="scrim"><div class="dialog">
      <div class="ic">${ic("shield", "width:40px;height:40px;color:#1A73E8")}</div>
      <h2>Unsafe app blocked</h2>
      <p>Play Protect doesn't recognise this app's developer. Apps from unknown developers can sometimes be unsafe.</p>
      <p style="margin-top:12px;font-weight:500;color:#1A73E8">▾ More details</p>
      <div class="actions"><span class="btn ring">Install anyway</span><span class="btn fill">OK</span></div>
    </div></div>`),

  "07-restricted-settings": () => phone(`
    ${topBar("App info", { more: true })}
    <div class="menu"><div>Uninstall updates</div><div class="hl" style="border-radius:0">Allow restricted settings</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;padding:30px 0 10px">
      <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#3D8BFD,#0F4FB8)"></div>
      <div style="font-size:22px;margin-top:14px">SMS Toolbox</div>
    </div>
    <div class="list">
      ${item("", "Notifications", "~0 notifications per week")}
      ${item("", "Permissions", "No permissions allowed")}
      ${item("", "Storage & cache", "24 MB used in internal storage")}
    </div>`),

  "08-in-app-update": () => phone(`
    <div class="app-top"><span class="grow">Settings</span></div>
    <div class="card">
      <div style="display:flex;gap:14px;align-items:center">${ic("update", "color:#1A73E8")}<div><div style="font-size:16px;font-weight:500">Updates</div><div class="muted">Installed version: 2.0.10</div></div></div>
      <div style="color:#1A73E8;margin-top:12px">Version 2.0.11 is available.</div>
      <span class="pbtn" style="box-shadow:0 0 0 3px #E8710A">Download and install</span><span class="obtn">What's new</span>
    </div>
    <div class="banner" style="margin:24px 16px 0;border-radius:12px">${ic("update")}<span class="grow">SMS Toolbox 2.0.11 is available.</span><b style="color:#1A73E8">Update</b></div>
    <p class="muted" style="margin:8px 20px">↑ The banner on the main screen takes you here.</p>`),
};

window.SCREEN_KEYS = Object.keys(SCREENS);
window.renderScreen = key => { document.getElementById("stage").innerHTML = SCREENS[key](); };
</script>
</body>
</html>
