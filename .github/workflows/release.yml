name: Build & Release

# One pipeline, two distributions of the same app (same applicationId, same signing key,
# same versionCode -- see app/build.gradle.kts):
#   github flavor -> SMS-Toolbox_vX.Y.Z.apk on a GitHub release. Every feature, plus the
#                    in-app update check that reads these releases.
#   play flavor   -> app-play-release.aab uploaded to Google Play's internal track.
#                    Backup & Restore only, no SEND_SMS.
# publish-play-store.yml stays as a manual way to (re)upload the Play bundle to another track.

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serializes runs so a version-bump commit from one run is always on `main`
# before the next run's "Bump patch version" step reads CURRENT_VERSION and
# pushes its own bump commit. Without this, two pushes to `main` landing
# close together (e.g. a PR merge immediately followed by a direct push)
# race: both jobs check out `main` before either has pushed, so the second
# job's `git push` is rejected once the first job's bump commit lands.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          sed -i "s/versionName = \"$CURRENT_VERSION\"/versionName = \"$NEW_VERSION\"/" app/build.gradle.kts

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"

          # Belt-and-braces alongside the workflow-level concurrency group above:
          # retry against a freshly fetched main if something outside this
          # workflow's own concurrency group (e.g. a manual push) still races us.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::git push to main failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
            git fetch origin main
            git rebase origin/main
          done

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Build signed GitHub APK and Play bundle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # versionCode is derived from versionName in build.gradle.kts, so both artifacts share it.
        run: ./gradlew assembleGithubRelease bundlePlayRelease

      - name: Verify the Play bundle does not request SEND_SMS
        run: |
          set -euo pipefail
          # The Play listing declares Backup and restore only. Fail the release rather than
          # ship a bundle whose merged manifest asks for SEND_SMS or self-update rights.
          manifest=$(find app/build/intermediates -path '*playRelease*' -name AndroidManifest.xml -print -quit)
          test -n "$manifest"
          if grep -E 'android.permission.(SEND_SMS|REQUEST_INSTALL_PACKAGES)' "$manifest"; then
            echo "::error::Play bundle manifest ($manifest) declares a forbidden permission" >&2
            exit 1
          fi

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/github/release/app-github-release.apk app/build/outputs/apk/github/release/SMS-Toolbox_v${{ steps.bump.outputs.new_version }}.apk

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # softprops/action-gh-release's `generate_release_notes` only fills in the body
          # when it's empty. On a re-run for the same tag (e.g. a second merge before a
          # version bump), it re-appends freshly generated notes onto the *existing*
          # release body instead of replacing it, so the description grows with
          # duplicated content every time. Generating the notes ourselves and passing
          # them as an explicit body ensures the release body is always fully replaced.
          # Retry on transient GitHub API errors (e.g. 5xx) so a brief outage
          # doesn't fail an otherwise-successful build after the APK is signed.
          for attempt in 1 2 3 4 5; do
            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="v${{ steps.bump.outputs.new_version }}" \
              -f target_commitish="${{ steps.bump.outputs.new_sha }}" \
              --jq '.body' > release_notes.md; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Generating release notes failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          cat >> release_notes.md <<'NOTES'

          ---
          **Installing:** download `SMS-Toolbox_v*.apk` below. This GitHub build has every feature (Backup & Restore, Redirect, Schedule) and tells you in the app when a new version is out. First time installing an APK? Follow the [step-by-step guide](https://github.com/neteinstein/SMS-Redirect/blob/main/docs/install-apk.md).
          The Google Play version has Backup & Restore only. Both are the same app signed with the same key, so you can switch between them without losing data.
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          target_commitish: ${{ steps.bump.outputs.new_sha }}
          name: Release v${{ steps.bump.outputs.new_version }}
          files: app/build/outputs/apk/github/release/SMS-Toolbox_v${{ steps.bump.outputs.new_version }}.apk
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode Play Store service account key
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-store-key.json

      - name: Upload Play bundle to the internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.neteinstein.smsredirect
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          tracks: internal
          changesNotSentForReview: true

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f app/keystore.jks
          rm -f play-store-key.json
