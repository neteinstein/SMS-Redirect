name: Publish to Play Store

on:
  workflow_run:
    workflows: ["Build & Release APK"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # release.yml pushes a version-bump commit to main *after* it starts, so
          # head_sha (the commit that triggered it) no longer has the bumped
          # versionName. Checking out main's tip picks up that bump commit, which
          # is already pushed by the time this workflow_run fires.
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Build signed release bundle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease -PVERSION_CODE=${{ github.run_number }}

      - name: Verify Play bundle does not declare SEND_SMS
        run: |
          manifest=app/build/intermediates/merged_manifest/playRelease/processPlayReleaseMainManifest/AndroidManifest.xml
          test -f "$manifest"
          if grep -q 'android.permission.SEND_SMS' "$manifest"; then
            echo "::error::SEND_SMS found in the play flavor's merged manifest"
            exit 1
          fi

      - name: Decode Play Store service account key
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-store-key.json

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.neteinstein.smsredirect
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          tracks: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f app/keystore.jks
          rm -f play-store-key.json
