name: Publish to Play Store

# Manual only. Every merge to main already uploads the Play bundle to the internal track from
# release.yml; use this to upload the current main to another track.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      build_number:
        description: >-
          0-99, added to the versionCode. Play rejects a versionCode it has already seen, and
          release.yml already uploaded this version with 0, so use 1 (or higher on repeats).
        required: true
        default: '1'
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Build signed Play bundle (no self-update)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: ./gradlew bundlePlayRelease -PVERSION_CODE_BUILD="$BUILD_NUMBER"

      - name: Decode Play Store service account key
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-store-key.json

      - name: Set up the Play upload script
        run: |
          # A virtualenv: the runner's system Python refuses pip installs (PEP 668).
          python3 -m venv "$RUNNER_TEMP/play-venv"
          "$RUNNER_TEMP/play-venv/bin/pip" install --quiet google-auth==2.61.0 requests==2.32.5
          (cd .github/scripts && "$RUNNER_TEMP/play-venv/bin/python" -m unittest test_play_publish)

      # Not r0adkll/upload-google-play: its changesNotSentForReview input had to be hardcoded, and
      # Play requires or refuses that parameter depending on the app's publishing state, so every
      # fixed value eventually broke this step. The script picks it per upload; see its docstring.
      - name: Upload to Play Store
        run: >-
          "$RUNNER_TEMP/play-venv/bin/python" .github/scripts/play_publish.py
          --key play-store-key.json
          --package com.neteinstein.smsredirect
          --aab app/build/outputs/bundle/playRelease/app-play-release.aab
          --track "${{ inputs.track }}"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f app/keystore.jks
          rm -f play-store-key.json
