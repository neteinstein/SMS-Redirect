name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        check: [ktlint, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Run ktlint
        if: matrix.check == 'ktlint'
        run: ./gradlew ktlintCheck

      - name: Run unit tests
        if: matrix.check == 'unit-tests'
        run: ./gradlew test

      # Temporary: this session's own network egress can't reach dl.google.com to run a
      # real Gradle build, so the Room v10 schema JSON (needed for PR #90 review) has to be
      # pulled out of a CI run that can. Remove after committing app/schemas/ from this.
      - name: Upload Room schema
        if: always() && matrix.check == 'unit-tests'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: room-schema
          path: app/schemas/
          if-no-files-found: warn
